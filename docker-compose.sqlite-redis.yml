services:
  server:
    build:
      context: .
    # the image starts the server only, so run the migrations first
    command: ["sh", "-c", "node node_modules/knex/bin/cli.js migrate:latest && exec node server/server.js --production"]
    # the image does not contain .env, so hand it to the container
    env_file:
      - path: .env
        required: false
    volumes:
      - db_data_sqlite:/var/lib/kutt
      - custom:/kutt/custom
    environment:
      DB_FILENAME: "/var/lib/kutt/data.sqlite"
      REDIS_ENABLED: true
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - 3000:3000
    depends_on:
      redis:
        condition: service_started
  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379
volumes:
  db_data_sqlite:
  custom: